name: Build CBF for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build Windows mod
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Win64
          path: ./predictive-input-buffer-3.1.0-modified
          
      - name: Upload GEODE file
        uses: actions/upload-artifact@v4
        with:
          name: CBF-Windows-geode
          path: ${{ steps.build.outputs.output }}/*.geode
